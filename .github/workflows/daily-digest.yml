name: feedlens daily digest

on:
  schedule:
    - cron: "0 22 * * *" # 07:00JTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run index.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_HOT_WEBHOOK_URL: ${{ secrets.DISCORD_HOT_WEBHOOK_URL }}
          DISCORD_DIGEST_WEBHOOK_URL: ${{ secrets.DISCORD_DIGEST_WEBHOOK_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}